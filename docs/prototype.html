function filesPage(){const items=visible(),all=sorted(),ids=new Set(items.map(f=>f.id)),total=currentFiles().length;const selectedAll=items.length>0&&items.every(f=>state.selected.has(f.id));const result=state.view==='list'?`<div class="table-wrap"><table class="file-table"><thead><tr><th class="check-col"><input type="checkbox" data-select-all ${selectedAll?'checked':''} aria-label="选择当前目录全部项目"></th><th>名称</th><th class="size-col">大小</th><th class="time-col">修改时间</th><th class="actions-col"><span class="sr">操作</span></th></tr></thead><tbody>${fileRows(all,ids)}</tbody></table></div>`:`<div class="file-grid">${fileCards(all,ids)}</div>`;const empty=state.status==='empty'?`<span class="empty-icon">${icon('folder')}</span><h2>这个文件夹还是空的</h2><p>上传文件，或新建一个文件夹开始整理。</p><div class="empty-actions"><button class="btn btn-secondary" data-action="new-folder">${icon('plus')}新建文件夹</button><button class="btn btn-primary" data-action="upload">${icon('upload')}上传文件</button></div>`:`<span class="empty-icon">${icon('search')}</span><h2>没有匹配的文件</h2><p>换一个关键词，或清空当前搜索。</p><button class="btn btn-secondary" data-action="clear-search">清空搜索</button>`;let content=`<div id="empty" class="empty" ${items.length?'hidden':''}>${empty}</div><div id="results" ${items.length?'':'hidden'}>${result}</div>`;if(state.status==='loading')content=`<div role="status" aria-busy="true" aria-label="正在加载文件">${Array.from({length:7},()=>'<div class="skeleton-row"><span class="sk sk-check"></span><span class="sk sk-icon"></span><span class="sk sk-name"></span><span class="sk sk-size"></span><span class="sk sk-time"></span></div>').join('')}</div>`;if(state.status==='error')content=`<div class="empty" role="alert"><span class="empty-icon">${icon('alert')}</span><h2>无法加载当前目录</h2><p>请求返回 HTTP 500。检查网络连接后重试。</p><button class="btn btn-secondary" data-action="retry">${icon('restore')}重新加载</button></div>`;const desc=state.status==='loading'?'正在读取当前目录':state.status==='error'?'当前目录加载失败':`${total} 个项目`;const footer=state.status==='loading'?'正在加载…':state.status==='error'?'加载失败':`显示 ${items.length} / ${total} 个项目`;return `<main class="main"><div class="wrap"><div class="page-head"><div><nav class="breadcrumb" aria-label="当前位置"><button data-action="path">全部文件</button>${icon('right')}<button data-action="path">项目资料</button>${icon('right')}<span class="breadcrumb-current" aria-current="page">2026</span></nav><h1 class="page-title">2026</h1><p class="page-desc">${desc}</p></div><div class="page-actions">${createControl()}<button class="btn btn-primary page-upload" data-action="upload">${icon('upload')}上传文件</button></div></div><section class="panel" aria-label="文件列表">${toolbar()}${content}<footer class="file-footer"><span id="visible-count">${footer}</span><span class="footer-hint">${icon('clock')}浏览器时区 · ${zone}</span></footer></section></div></main>`}
function trashPage(){return `<main class="main"><div class="wrap"><div class="page-head"><div><h1 class="page-title">回收站</h1><p class="page-desc">${trash.length} 组删除记录</p></div></div><div class="page-intro"><span class="page-intro-icon">${icon('restore')}</span><div><h2>可恢复或彻底删除</h2><p>超过 14 天的项目会在后续清理时移除。恢复操作会保留原路径。</p></div></div><section class="panel"><div class="table-wrap"><table class="trash-table"><thead><tr><th>项目</th><th class="trash-date">删除时间</th><th class="trash-count">项目数</th><th class="trash-actions">操作</th></tr></thead><tbody>${trash.map(t=>`<tr><td><div class="trash-name"><span class="type-icon ${t.count>1?'kind-folder':'kind-code'}">${icon(t.count>1?'folder':'fileCode')}</span><span><strong>${t.name}</strong><small>${t.detail}</small></span></div></td><td class="file-meta">${time(t.iso)}</td><td class="file-meta">${t.count}</td><td><div class="trash-buttons"><button class="btn btn-secondary btn-small" data-action="restore" data-id="${t.id}" data-name="${t.name}">${icon('restore')}恢复</button><button class="btn btn-danger btn-small" data-action="delete" data-id="${t.id}">${icon('trash')}彻底删除</button></div></td></tr>`).join('')}</tbody></table></div></section></div></main>`}

function uploadPanel(){const labels={completed:'已完成',uploading:'上传中',failed:'上传失败',pending:'等待中',cancelled:'已取消'};const hasCompleted=state.uploadTasks.some(t=>t.status==='completed');return `<section class="upload-panel" aria-label="上传队列演示"><div class="upload-head"><span class="upload-title">${icon('upload')}上传队列 · ${state.uploadTasks.length} 项</span><div class="upload-head-actions"><button class="upload-clear" data-action="clear-completed" ${hasCompleted?'':'disabled'}>清除完成</button><button class="icon-btn" data-action="close-upload" aria-label="收起上传队列">${icon('x')}</button></div></div><div class="upload-list">${state.uploadTasks.map(t=>{const pct=t.total?Math.round(t.loaded/t.total*100):0;const status=t.status==='uploading'?`${pct}% · ${size(t.loaded)} / ${size(t.total)}`:labels[t.status];return `<div class="upload-item"><div class="upload-top"><span class="type-icon kind-${t.kind}">${icon(t.kind==='pdf'?'fileText':t.kind)}</span><span class="upload-name" title="${t.name}">${t.name}</span><span class="upload-status">${status}</span>${['pending','uploading'].includes(t.status)?`<button class="icon-btn" data-action="cancel-task" data-id="${t.id}" aria-label="取消 ${t.name}">${icon('x')}</button>`:''}${['failed','cancelled'].includes(t.status)?`<button class="icon-btn" data-action="retry-task" data-id="${t.id}" aria-label="重试 ${t.name}">${icon('restore')}</button>`:''}</div>${t.status==='uploading'?`<div class="progress" role="progressbar" aria-label="${t.name}" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100"><div style="width:${pct}%"></div></div>`:''}${t.status==='completed'?'<div class="progress"><div class="complete" style="width:100%"></div></div>':''}${t.error?`<div class="upload-error" role="alert">${t.error}</div>`:''}</div>`}).join('')}</div></section>`}

function previewContent(f){if(f.kind==='text'&&f.bytes>1048576)return `<div class="empty"><span class="empty-icon">${icon('fileText')}</span><h2>文件超过预览上限</h2><p>文本预览上限为 1 MB，请下载后查看。</p><button class="btn btn-secondary" data-action="notice" data-message="下载 ${f.name}">${icon('download')}下载文件</button></div>`;if(f.kind==='image')return `<div class="image-preview">${mockBanner()}</div>`;if(f.kind==='pdf')return `<div class="pdf-view"><div class="pdf-page"><h2>品牌规范</h2><p>品牌色、字体与文件组件使用规则</p><div class="pdf-rule"></div><p>橙色用于关键操作，导航与内容使用语义主题色。</p></div><div class="pdf-pager"><button class="icon-btn" data-action="preview-prev" aria-label="上一页" ${state.previewPage===1?'disabled':''}>${icon('right')}<span class="sr">上一页</span></button><span>第 ${state.previewPage} / 12 页</span><button class="icon-btn" data-action="preview-next" aria-label="下一页" ${state.previewPage===12?'disabled':''}>${icon('right')}</button></div></div>`;if(f.kind==='code'||f.kind==='text')return `<div class="code-view"><div class="preview-toolbar"><span>${f.sub} · UTF-8</span><span>只读预览</span></div><pre>${f.kind==='code'?'# 产品路线图\n\n## 第一阶段\n- 文件浏览与预览\n- WebDAV 客户端接入\n- 上传队列与回收站\n\n## 验收\n所有时间精确到秒，并使用浏览器时区。':'访谈记录\n\n用户：希望能快速找到最近的文件。\n用户：移动端需要明确的上传入口。\n\n备注：保持单用户模型，不增加协作功能。'}</pre></div>`;if(f.kind==='video'||f.kind==='audio')return `<div class="media-player"><button class="media-play" data-action="notice" data-message="播放 ${f.name}" aria-label="播放 ${f.name}">${icon('play')}</button><div class="media-track"><span style="width:35%"></span></div><div class="media-time">04:27 / ${f.sub}</div></div>`;return `<div class="empty"><h2>暂不支持此类型预览</h2><p>你可以下载原文件后使用本地应用打开。</p></div>`}

function syncReview(){document.querySelectorAll('[data-review]').forEach(b=>b.classList.toggle('active',b.dataset.review===state.screen));const statusBtn=document.querySelector('[data-status]');const labels={normal:'正常',loading:'加载',empty:'空目录',error:'错误'};statusBtn.hidden=state.screen!=='files';statusBtn.textContent=`场景：${labels[state.status]}`;const themeBtn=document.querySelector('[data-theme-toggle]');themeBtn.textContent=state.theme==='dark'?'浅色':'暗色'}

function focusNext(selector){requestAnimationFrame(()=>document.querySelector(selector)?.focus())}function render(){document.documentElement.dataset.theme=state.theme;const page=state.screen==='trash'?trashPage():state.screen==='settings'?settingsPage():filesPage();document.getElementById('app').innerHTML=state.screen==='login'?loginPage():shell(page);syncReview();updateNote();const all=document.querySelector('[data-select-all]');if(all){const items=visible(),n=items.filter(f=>state.selected.has(f.id)).length;all.checked=items.length>0&&n===items.length;all.indeterminate=n>0&&n<items.length}if(state.preview){const id=state.preview.id,d=document.getElementById('preview');d.addEventListener('close',()=>{state.preview=null;render();focusNext(`[data-action="open"][data-id="${id}"]`)},{once:true});d.showModal()}if(state.delete){const id=state.delete.id,d=document.getElementById('delete-modal');d.addEventListener('close',()=>{state.delete=null;render();focusNext(`[data-action="delete"][data-id="${id}"]`)},{once:true});d.showModal()}if(state.newFolder)openAuxDialog('folder-modal',()=>{state.newFolder=false;render();focusNext('[data-action="create-menu"]')});if(state.conflict)openAuxDialog('conflict-modal',()=>{state.conflict=null;render();focusNext(state.text?'#note-name':'[data-action="create-menu"]')});if(state.restoreConflict){const id=state.restoreConflict.id;openAuxDialog('restore-modal',()=>{state.restoreConflict=null;render();focusNext(`[data-action="restore"][data-id="${id}"]`)})}if(state.unsavedConfirm)openAuxDialog('unsaved-modal',()=>{state.unsavedConfirm=false;render();focusNext('#note-body')});translatePage()}
let toastTimer;function notify(message,action){const el=document.getElementById('toast');clearTimeout(toastTimer);el.replaceChildren(document.createTextNode(translateText(message)));if(action){const button=document.createElement('button');button.type='button';button.textContent=action.label;button.dataset.action='navigate';button.dataset.screen=action.screen;el.appendChild(button)}el.classList.add('show');toastTimer=setTimeout(()=>el.classList.remove('show'),3000)}function navigate(screen){state.screen=screen;state.selected.clear();state.menu=null;state.sortMenu=state.createMenu=state.account=state.languageOpen=state.mobile=state.upload=state.text=false;state.newFolder=state.unsavedConfirm=false;state.conflict=state.restoreConflict=null;state.preview=state.delete=null;state.loginStatus='idle';state.loginError='';if(screen==='login')state.sessionExpired=false;render()}
document.addEventListener('click',e=>{const review=e.target.closest('[data-review]');if(review)return navigate(review.dataset.review);if(e.target.closest('[data-status]')){const a=['normal','loading','empty','error'];state.status=a[(a.indexOf(state.status)+1)%4];state.search='';state.selected.clear();render();return}if(e.target.closest('[data-theme-toggle]')){state.theme=state.theme==='dark'?'light':'dark';state.themePreference=state.theme;localStorage.setItem('r2_theme',state.themePreference);render();return}const t=e.target.closest('[data-action]');if(!t){let changed=false;if(state.menu&&!e.target.closest('.row-actions')){state.menu=null;changed=true}if(state.sortMenu&&!e.target.closest('.sort-control')){state.sortMenu=false;changed=true}if(state.createMenu&&!e.target.closest('.create-control')){state.createMenu=false;changed=true}if(state.account&&!e.target.closest('.account')){state.account=false;changed=true}if(state.languageOpen&&!e.target.closest('.language-control')){state.languageOpen=false;changed=true}if(changed)render();return}const a=t.dataset.action;if(a==='navigate')return navigate(t.dataset.screen);if(a==='logout')return navigate('login');if(a==='collapse'){state.collapsed=!state.collapsed;localStorage.setItem('r2-ui-collapsed',state.collapsed?'1':'0');render();focusNext('[data-action="collapse"]');return}if(a==='mobile'){state.mobile=true;render();return}if(a==='close-mobile'){state.mobile=false;render();return}if(a==='language'){state.languageOpen=!state.languageOpen;state.account=false;render();focusNext(state.languageOpen?'.language-menu [aria-pressed="true"]':'[data-action="language"]');return}if(a==='theme'){state.theme=state.theme==='dark'?'light':'dark';state.themePreference=state.theme;localStorage.setItem('r2_theme',state.themePreference);render();focusNext('[data-action="theme"]');return}if(a==='account'){state.languageOpen=false;state.account=!state.account;render();focusNext(state.account?'.account-menu [data-screen="settings"]':'[data-action="account"]');return}if(a==='upload'){state.upload=true;render();notify('这是上传队列的视觉演示，不会上传真实文件');return}if(a==='clear-completed'){state.uploadTasks=state.uploadTasks.filter(t=>t.status!=='completed');render();notify('已清除完成任务');return}if(a==='cancel-task'){const task=state.uploadTasks.find(task=>task.id===t.dataset.id);task.status='cancelled';render();return}if(a==='retry-task'){const task=state.uploadTasks.find(task=>task.id===t.dataset.id);task.status='uploading';task.loaded=0;task.error='';render();return}if(a==='close-upload'){state.upload=false;render();return}if(a==='create-menu'){state.createMenu=!state.createMenu;state.sortMenu=false;render();focusNext(state.createMenu?'[data-action="new-folder"]':'[data-action="create-menu"]');return}if(a==='new-folder'){state.createMenu=false;state.newFolder=true;state.folderName='';state.folderError='';render();focusNext('#folder-name');return}if(a==='new-text'){state.createMenu=false;state.textName=DEFAULT_TEXT_NAME;state.textBody=DEFAULT_TEXT_BODY;state.text=true;render();focusNext('#note-name');return}if(a==='close-text'){requestCloseText();return}if(a==='close-folder'){document.getElementById('folder-modal')?.close();return}if(a==='conflict-cancel'){document.getElementById('conflict-modal')?.close();return}if(a==='conflict-choice'){const choice=t.dataset.choice;state.conflict=null;state.text=false;document.getElementById('conflict-modal')?.close();notify(choice==='overwrite'?'已选择覆盖同名文件（演示）':'已选择自动重命名（演示）');return}if(a==='keep-editing'){document.getElementById('unsaved-modal')?.close();return}if(a==='discard-text'){state.text=false;document.getElementById('unsaved-modal')?.close();return}if(a==='close-restore'){document.getElementById('restore-modal')?.close();return}if(a==='soft-delete'){state.menu=null;render();notify(`${t.dataset.name} 已移至回收站`,{label:'查看回收站',screen:'trash'});return}if(a==='view'){state.view=t.dataset.view;state.menu=null;render();return}if(a==='sort-menu'){state.sortMenu=!state.sortMenu;state.createMenu=false;render();focusNext(state.sortMenu?`[data-action="set-sort"][data-sort="${state.sort}"]`:'[data-action="sort-menu"]');return}if(a==='sort-dir'){state.dir=state.dir==='asc'?'desc':'asc';render();return}if(a==='set-sort'){state.sort=t.dataset.sort;state.dir=state.sort==='name'?'asc':'desc';state.sortMenu=false;render();focusNext('[data-action="sort-menu"]');return}if(a==='clear-selection'){state.selected.clear();render();return}if(a==='clear-search'){state.search='';render();focusNext('#search');return}if(a==='retry'){state.status='normal';render();return}if(a==='open'){const f=files.find(x=>x.id===t.dataset.id);if(f.kind==='folder')return notify(`文件夹「${f.name}」：目录导航不在原型中展开`);state.preview=f;state.previewPage=1;render();return}if(a==='preview-prev'){state.previewPage=Math.max(1,state.previewPage-1);render();focusNext('[data-action="preview-prev"]');return}if(a==='preview-next'){state.previewPage=Math.min(12,state.previewPage+1);render();focusNext('[data-action="preview-next"]');return}if(a==='close-preview'){document.getElementById('preview')?.close();return}if(a==='row-menu'){state.menu=state.menu===t.dataset.id?null:t.dataset.id;render();return}if(a==='notice'){state.menu=null;render();notify(`原型操作：${t.dataset.message}`);return}if(a==='bulk-download'){const count=files.filter(f=>state.selected.has(f.id)&&f.kind!=='folder').length;return notify(`原型操作：下载 ${count} 个所选文件`);}if(a==='bulk-delete')return notify(`已选 ${state.selected.size} 个项目已移至回收站`,{label:'查看回收站',screen:'trash'});if(a==='path')return notify('目录导航将在实施时接入现有 searchParams 状态');if(a==='restore'){const item=trash.find(x=>x.id===t.dataset.id);if(item.id==='t1'){state.restoreConflict=item;render();return}notify(`已恢复 ${item.name}`,{label:'查看文件',screen:'files'});return}if(a==='delete'){state.delete=trash.find(x=>x.id===t.dataset.id);render();return}if(a==='close-delete'){document.getElementById('delete-modal')?.close();return}if(a==='confirm-delete'){const name=state.delete.name;document.getElementById('delete-modal')?.close();notify(`原型操作：已彻底删除 ${name}`);return}if(a==='set-theme'){state.themePreference=t.dataset.themeValue;localStorage.setItem('r2_theme',state.themePreference);if(state.themePreference==='system')state.theme=matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light';else state.theme=state.themePreference;render();return}if(a==='set-language'){const closeLanguage=state.languageOpen;state.languageOpen=false;state.language=t.dataset.language;localStorage.setItem('i18nextLng',state.language);render();if(closeLanguage)focusNext('[data-action="language"]');notify(state.language==='zh'?'界面语言：简体中文':'Language preference: English');return}});
document.addEventListener('change',e=>{const t=e.target;if(t.matches('[data-select]')){if(t.checked)state.selected.add(t.dataset.select);else state.selected.delete(t.dataset.select);render()}if(t.matches('[data-select-all]')){visible().forEach(f=>{if(t.checked)state.selected.add(f.id);else state.selected.delete(f.id)});render()}});
document.addEventListener('input',e=>{if(e.target.matches('#folder-name')){state.folderName=e.target.value;state.folderError='';document.querySelector('#folder-modal .form-error')?.remove();return}if(e.target.matches('#username,#password')){if(e.target.id==='username')state.loginUsername=e.target.value;else state.loginPassword=e.target.value;state.loginError='';document.querySelector('.login-card .form-error')?.remove();return}if(e.target.matches('#note-body,#note-name')){if(e.target.id==='note-name')state.textName=e.target.value;else state.textBody=e.target.value;updateNote();return}if(!e.target.matches('#search'))return;state.search=e.target.value;const items=visible(),ids=new Set(items.map(f=>f.id));document.querySelectorAll('[data-file]').forEach(el=>el.hidden=!ids.has(el.dataset.id));document.getElementById('results').hidden=items.length===0;document.getElementById('empty').hidden=items.length>0;document.getElementById('visible-count').textContent=`显示 ${items.length} / ${currentFiles().length} 个项目`;const all=document.querySelector('[data-select-all]');if(all){const n=items.filter(f=>state.selected.has(f.id)).length;all.checked=items.length>0&&n===items.length;all.indeterminate=n>0&&n<items.length;translatePage()}});
document.addEventListener('submit',e=>{if(e.target.matches('[data-form="folder"]')){e.preventDefault();const name=state.folderName.trim();if(!name){state.folderError='请输入文件夹名称';render();focusNext('#folder-name');return}if(currentFiles().some(f=>f.name===name)){state.folderError='当前目录已有同名项目，请使用其他名称';render();focusNext('#folder-name');return}state.newFolder=false;document.getElementById('folder-modal')?.close();notify(`已创建文件夹 ${name}（演示）`);return}if(e.target.matches('[data-form="text"]')){e.preventDefault();const name=state.textName.trim();if(currentFiles().some(f=>f.name===name)){state.conflict={name};render();return}state.text=false;render();notify(`文本文件 ${name} 已保存到当前目录`);return}if(e.target.matches('[data-form="login"]')){e.preventDefault();state.loginStatus='submitting';state.loginError='';state.sessionExpired=false;render();setTimeout(()=>{if(state.screen!=='login')return;if(state.loginPassword==='wrong'){state.loginStatus='error';state.loginError='用户名或密码不正确';render();focusNext('#password');return}if(state.loginUsername==='network'){state.loginStatus='error';state.loginError='无法连接服务器，请检查网络后重试';render();focusNext('#password');return}navigate('files');notify('原型登录成功：未验证或发送任何凭据')},400)}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&(state.newFolder||state.conflict||state.restoreConflict||state.unsavedConfirm))return;if(e.key==='Escape'&&state.text){e.preventDefault();requestCloseText();return}if(state.text&&!state.conflict&&!state.unsavedConfirm&&e.key==='Tab'){const all=Array.from(document.querySelectorAll('.drawer button:not([disabled]),.drawer input,.drawer textarea'));const first=all[0],last=all[all.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}return}if(e.key!=='Escape')return;const returnText=state.text,returnAccount=state.account,returnCreate=state.createMenu,returnSort=state.sortMenu,returnLanguage=state.languageOpen;if(state.text||state.upload||state.mobile||state.menu||state.sortMenu||state.createMenu||state.account||state.languageOpen){state.text=state.upload=state.mobile=state.sortMenu=state.createMenu=state.account=state.languageOpen=false;state.menu=null;render();if(returnText||returnCreate)focusNext('[data-action="create-menu"]');if(returnAccount)focusNext('[data-action="account"]');if(returnSort)focusNext('[data-action="sort-menu"]');if(returnLanguage)focusNext('[data-action="language"]')}});
matchMedia('(prefers-color-scheme:dark)').addEventListener('change',event=>{if(state.themePreference==='system'){state.theme=event.matches?'dark':'light';render()}});
render();
